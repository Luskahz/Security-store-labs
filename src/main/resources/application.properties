spring.application.name=security-store-labs
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/security_store?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America%2FSao_Paulo}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}
spring.datasource.username=root
spring.datasource.password=aluno
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
server.error.include-message=never
security.jwt.secret=${JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
security.pii.encryption-key=${PII_ENCRYPTION_KEY:YWJjZGVmMDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODk=}
security.jwt.issuer=store-api
security.jwt.access-token-expiration=900
security.refresh-token-expiration=2592000
security.bootstrap.admin.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
security.bootstrap.admin.name=${ADMIN_NAME:}
security.bootstrap.admin.email=${ADMIN_EMAIL:}
security.bootstrap.admin.password=${ADMIN_PASSWORD:}
security.demo.enabled=false
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:0}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
app.mail.from=${APP_MAIL_FROM:no-reply@localhost}
app.user-facing.password-reset-url=${APP_PASSWORD_RESET_URL:http://localhost:8080/password-reset.html}
security.auth.password-recovery-request-ttl=${PASSWORD_RECOVERY_TTL:15m}
security.auth.password-recovery-cooldown=${PASSWORD_RECOVERY_COOLDOWN:60s}
