# Replace 10.81.211.139 with the VM's authorized, current bridged IP.
server {
    listen 80;
    server_name 10.81.211.139;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name 10.81.211.139;

    server_tokens off;
    ssl_certificate     /etc/ssl/certs/security-store-labs.crt;
    ssl_certificate_key /etc/ssl/private/security-store-labs.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}

