<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acessar · Security Store</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="login-page">
  <main class="login-card">
    <a class="brand" href="/">Security <span>Store</span><small>LABS</small></a>
    <h1 id="form-title">Entre na sua conta</h1>
    <p id="form-subtitle">Acesse pedidos e acompanhe suas entregas.</p>

    <form id="form">
      <div id="name-field" hidden>
        <label for="name">Nome</label>
        <input id="name" name="name" autocomplete="name" minlength="2">
      </div>
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" autocomplete="username" required>
      <label for="password">Senha</label>
      <input id="password" name="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" required>
      <button id="submit" type="submit">Entrar</button>
    </form>

    <p id="error" class="error" role="alert"></p>
    <nav class="link-row" aria-label="Navegação da conta">
      <a href="/">← Voltar à loja</a>
      <span class="account-links"><a id="toggle-mode" href="#register">Criar conta</a><a id="forgot-link" href="/password-reset.html">Esqueci minha senha</a></span>
    </nav>
  </main>
  <script type="module" src="/js/pages/login.js"></script>
</body>
</html>
