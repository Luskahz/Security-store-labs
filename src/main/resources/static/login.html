<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acessar · Security Store</title><link rel="stylesheet" href="/styles.css"></head>
<body class="login-page"><main class="login-card"><a class="brand" href="/">Security <span>Store</span><small>LABS</small></a><h1 id="form-title">Entre na sua conta</h1><p id="form-subtitle">Acesse pedidos e acompanhe suas entregas.</p>
  <form id="form"><div id="name-field" hidden><label>Nome<input id="name" name="name" autocomplete="name" minlength="2"></label></div><label>E-mail<input id="email" name="email" type="email" autocomplete="username" required></label><label>Senha<input id="password" name="password" type="password" autocomplete="current-password" minlength="8" required></label><button id="submit">Entrar</button></form>
  <p id="error" class="error" role="alert"></p><div class="link-row"><a href="/">← Voltar à loja</a><a id="toggle-mode" href="#register">Criar conta</a></div>
</main><script type="module" src="/js/pages/login.js"></script></body></html>
