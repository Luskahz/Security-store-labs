<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>Recuperar senha · Security Store</title><link rel="stylesheet" href="/styles.css"></head>
<body class="login-page"><main class="login-card"><a class="brand" href="/">Security <span>Store</span><small>LABS</small></a>
  <section id="request-view"><h1>Recuperar senha</h1><p>Se o e-mail estiver cadastrado, enviaremos um link para redefinição.</p><form id="recovery-form"><label for="recovery-email">E-mail</label><input id="recovery-email" type="email" autocomplete="email" required><button>Enviar link de recuperação</button></form></section>
  <section id="reset-view" hidden><h1>Defina uma nova senha</h1><p>Use pelo menos 12 caracteres.</p><form id="reset-form"><label for="new-password">Nova senha</label><input id="new-password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required><button>Redefinir senha</button></form></section>
  <p id="reset-message" class="notice" role="status" aria-live="polite"></p><nav class="link-row"><a href="/login.html">Voltar ao login</a></nav>
</main><script type="module" src="/js/pages/password-reset.js"></script></body></html>
